services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sankofa
      POSTGRES_PASSWORD: sankofa
      POSTGRES_DB: sankofa
    ports:
      - '5432:5432'
    volumes:
      - sankofa_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  sankofa_pg:
